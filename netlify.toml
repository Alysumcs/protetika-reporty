# Netlify konfigurácia pre Protetika Reporty
# Súbory sú v koreni repozitára (index.html + assets/), preto publish = "."

[build]
  publish = "."
  command = ""

# Každá adresa sa zobrazí ako index.html (jednostránková aplikácia)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assety majú v názve hash, takže sa nikdy nemenia -> prehliadač si ich môže
# nechať uložené na rok. Opakované návštevy potom takmer nič nesťahujú.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html sa naopak nesmie kešovať, aby si vždy dostal najnovšiu verziu
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
